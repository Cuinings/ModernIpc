name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # 只有推送类似 v1.0.0, v1.2 等 tag 时才会触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 需要
      packages: write # 推送到 GitHub Packages 需要

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Publish to GitHub Packages
        # 直接执行 publish 任务。由于我们在 build.gradle.kts 中配置了 GitHubPackages，
        # 它会自动将产物推送到该仓库。
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Collect Output Artifacts
        run: |
          mkdir -p release-assets
          find . -type f -name "*-release.aar" -exec cp {} release-assets/ \;
          find . -type f -path "*/build/libs/*.jar" -exec cp {} release-assets/ \;

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
